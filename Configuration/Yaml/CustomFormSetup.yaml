# Antibot adds one template path and changes nothing else.
#
# The path carries a single template, AntibotBlocked.html. Fluid checks the paths from
# the highest index downwards and falls through to the next one when a file is absent,
# so every other template — Form.html above all — keeps coming from wherever the
# surrounding project keeps it. Adding a path is safe; adding a template to it would
# not be.
TYPO3:
  CMS:
    Form:
      prototypes:
        standard:
          formElementsDefinition:
            Form:
              renderingOptions:
                templateRootPaths:
                  1560: 'EXT:tw_antibot/Resources/Private/Templates/'
