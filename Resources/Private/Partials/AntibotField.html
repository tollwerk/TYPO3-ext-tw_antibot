<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment><!--

    One armor field.

    Hidden fields are hidden. The remaining types are honeypots: they have to reach the
    markup for a machine to fall for them, and they have to stay away from everyone
    else — out of the tab order, out of the accessibility tree, and never announced.

--></f:comment>
<formvh:renderRenderable renderable="{element}">
    <f:if condition="{element.renderingOptions.antibotType} == 'hidden'">
        <f:then>
            <f:form.hidden property="{element.identifier}" id="{element.uniqueIdentifier}"/>
        </f:then>
        <f:else>
            <div aria-hidden="true" hidden="hidden" style="display:none">
                <f:form.textfield property="{element.identifier}"
                                  id="{element.uniqueIdentifier}"
                                  type="{element.renderingOptions.antibotType}"
                                  tabindex="-1"
                                  additionalAttributes="{autocomplete: 'off'}"/>
            </div>
        </f:else>
    </f:if>
</formvh:renderRenderable>
</html>
